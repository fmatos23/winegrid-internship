# Same pattern as winegrid/lwm2m/overlay-wifi.conf: credentials baked into
# the firmware image (PoC convenience, not secure storage - see
# notas_estagio.md), auto-connect at boot handled in main.c.
CONFIG_WIFI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_SHELL=y
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_APP_WIFI_SSID="CHANGE_ME_SSID"
CONFIG_APP_WIFI_PSK="CHANGE_ME_PASSWORD"

CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

# Only IPv4 needed to reach ThingsBoard Cloud - same rationale as lwm2m/.
CONFIG_NET_IPV6=n