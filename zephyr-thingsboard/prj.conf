# Zephyr + ThingsBoard PoC: native Zephyr MQTT client (subsys/net/lib/mqtt)
# talking directly to the same ThingsBoard Cloud account/device profile as
# esp-idf-thingsboard/, over MQTTS (TLS), with device provisioning,
# telemetry and RPC (getStatus/reboot) - the representative subset of what
# was validated on ESP-IDF (secção 5 do relatório).

CONFIG_NETWORKING=y
CONFIG_NET_LOG=y
CONFIG_LOG=y

CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_POSIX_API=y

# DNS to resolve CONFIG_TB_BROKER_HOSTNAME (mqtt.eu.thingsboard.cloud).
CONFIG_DNS_RESOLVER=y

# Native MQTT client + TLS transport.
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y

# mbedTLS for the MQTTS handshake (server-cert verification only, no
# mutual TLS - ThingsBoard authenticates via MQTT username = access token,
# same scheme as esp-idf-thingsboard).
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=40000
# Default (16384, the RFC max fragment size) allocates static in+out TLS
# record buffers far bigger than our small JSON payloads ever need - this
# was the main cause of a ~13KB dram0_0_seg overflow on first build.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
CONFIG_MBEDTLS_SERVER_NAME_INDICATION=y

# The ThingsBoard Cloud cert chain (Sectigo/USERTrust ECC) is fully EC-based
# (P-256 and P-384 keys, ECDSA signatures) - none of this is enabled by
# Zephyr's default mbedTLS config (confirmed by the first flash attempt: CA
# parse failed with MBEDTLS_ERR_X509_UNKNOWN_SIG_ALG + OID_NOT_FOUND,
# -0x262e, because CONFIG_MBEDTLS_ECP_C itself was not set).
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=y

# The cert chain's signatures are SHA-384-based (ecdsa-with-SHA384,
# sha384WithRSAEncryption) - SHA-384 is not in Zephyr's default hash set
# either (same class of gap as the EC curves above).
CONFIG_MBEDTLS_SHA384=y

CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384

# For sys_reboot() in the RPC "reboot" method handler.
CONFIG_REBOOT=y