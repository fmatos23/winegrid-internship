# Wi-Fi networking for the ESP32, merged from zephyr/samples/net/wifi.
# This Zephyr version has no persistent Wi-Fi credentials subsystem, so
# main() connects automatically at boot using the SSID/PSK baked in below
# (see wifi_auto_connect() in lwm2m-client.c) instead of requiring the
# "wifi connect" shell command after every reset. The shell is still enabled
# below for manual debugging/override if needed.
CONFIG_WIFI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_SHELL=y

# ROOT CAUSE of every "registers before the network is up" bug we hit today:
# this was never enabled. main()'s "if (IS_ENABLED(CONFIG_NET_CONNECTION_MANAGER))"
# block - which waits for L4_CONNECTED before starting LwM2M - was being compiled
# out entirely as dead code, silently, because this was undefined. It's a
# menuconfig, not auto-selected by anything we had on.
CONFIG_NET_CONNECTION_MANAGER=y

# PoC convenience: credentials baked into the firmware image, not securely
# stored. Fine for a dev board on a lab network; revisit before any real
# deployment (see notas_estagio.md). REDACTED for version control - fill in
# locally before building.
CONFIG_APP_WIFI_SSID="CHANGE_ME_SSID"
CONFIG_APP_WIFI_PSK="CHANGE_ME_PASSWORD"

# Let DHCP (from the AP) assign the address instead of the static
# 192.0.2.x test addresses in prj.conf. NET_CONFIG_SETTINGS is what actually
# applies those static addresses regardless of the NEED_IPV4/6 flags, so it
# has to be fully disabled here, not just its sub-options.
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

# Disable IPv6: the interface gets an IPv6 link-local address (SLAAC) the
# instant it's up, with no DHCP/real network needed. The connection manager
# counts that as "L4 ready" and fires NET_EVENT_L4_CONNECTED way before real
# IPv4 (DHCP) connectivity exists, letting LwM2M start registering against a
# network that isn't actually up yet. We only need IPv4 to reach Leshan, so
# just turn IPv6 off.
CONFIG_NET_IPV6=n

# prj.conf's NET_PKT/NET_BUF counts (10 each) were sized for the qemu/native_sim
# test setup, not real Wi-Fi. A firmware push (Object 5) arrives as ~1330 CoAP
# blocks in a burst, concurrently with periodic LwM2M registration-update
# traffic - the esp32_wifi driver ran out of net buffers trying to receive it
# ("net_pkt: Data buffer allocation failed", "Failed to allocate net buffer"),
# and Leshan eventually gave up and cancelled the write ("500 Request cancelled").
CONFIG_NET_PKT_RX_COUNT=30
CONFIG_NET_PKT_TX_COUNT=30
CONFIG_NET_BUF_RX_COUNT=30
CONFIG_NET_BUF_TX_COUNT=30
