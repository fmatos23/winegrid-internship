# MCUboot support so this app can receive real OTA updates via the LwM2M
# Firmware Update object (5), written through flash_img + boot_request_upgrade
# in firmware_update.c. Same MCUboot already flashed/validated for smp_svr -
# it's board-level, not app-specific, so it doesn't need reflashing.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_REBOOT=y

# firmware_block_received_cb() calls flash_img_buffered_write() directly from
# the LwM2M engine's socket-receive thread. The default LWM2M_ENGINE_STACK_SIZE
# (2560B) isn't enough headroom for CoAP parsing + a real flash write call
# chain (stream_flash -> flash driver -> MCUboot bootutil helpers) - caused a
# stack-overflow crash ("illegal instruction" in thread lwm2m-sock-recv)
# partway through the very first firmware upload attempt.
CONFIG_LWM2M_ENGINE_STACK_SIZE=8192
