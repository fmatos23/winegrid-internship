# Espressif's default socs/esp32_procpu.conf sets CONFIG_BOOT_UPGRADE_ONLY=y,
# which overwrites the running image permanently with no revert path. Override
# it here to use the classic swap-with-scratch algorithm so an unconfirmed
# image is rolled back automatically on the next boot.
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_SWAP_USING_SCRATCH=y
